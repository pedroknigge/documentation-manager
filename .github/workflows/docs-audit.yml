# Example / opt-in GitHub Actions workflow for documentation-manager consumers.
#
# Copy into the consumer repo together with scripts/audit-claims.sh
# (local air-gapped gate — no network beyond checkout).
#
# Gate: parse the WHOLE claims matrix; fail merge on any critical Contradicted.
# Do not pass --list-changed here. That flag is the agent §6.0 change-set helper
# only — scoping the job to the diff would hide existing critical Contradicted.
#
# Missing matrix → skip (exit 0).
name: docs-audit

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  claims:
    name: Structural claims audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run air-gapped claims audit
        run: bash scripts/audit-claims.sh .
